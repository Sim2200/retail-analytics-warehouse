# Two targets. `duckdb` (default) is a local file and needs nothing else.
# `bigquery` needs a GCP project with the BigQuery API enabled and
# `gcloud auth application-default login`; then:
#   make bq-load BQ_PROJECT=<project-id>   # raw Parquet -> raw dataset (load jobs)
#   make bq-build BQ_PROJECT=<project-id>  # the same snapshot sequence + dbt build on BigQuery
retail_warehouse:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', '../warehouse.duckdb') }}"
      schema: main
      threads: 4
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('BQ_PROJECT', var('bq_project', 'your-gcp-project-id')) }}"
      dataset: retail_warehouse   # models override this with their own dataset (staging, marts, ...)
      location: US
      threads: 8
      priority: interactive
      job_execution_timeout_seconds: 600
